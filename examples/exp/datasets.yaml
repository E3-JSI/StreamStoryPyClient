datasets:
  river_flow:
    name: "river_flow"
    description: "River flow measurements dataset"
    file_path: "exp/data/river_flow.csv"
    datetime_col: "date"
    date_format: "%Y-%m-%dT%H:%M:%S"
    separator: ";"
    columns:
      - name: "date"
        type: "datetime"
        description: "Timestamp of the measurement"
      - name: "value"
        type: "float"
        description: "River flow value"
  
